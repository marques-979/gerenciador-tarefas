{% extends "base.html" %}

{% block titulo %}Editar tarefa{% endblock %}

{% block conteudo %}
<h2>Editar tarefa</h2>

<form class="nova" method="post">
  <input type="text" name="titulo" value="{{ request.form.get('titulo', tarefa['titulo']) }}" maxlength="120" required>
  <select name="prioridade" aria-label="Prioridade">
    {% for p in prioridades %}
      <option value="{{ p }}" {{ 'selected' if p == tarefa['prioridade'] }}>{{ p|capitalize }}</option>
    {% endfor %}
  </select>
  <button type="submit">Salvar</button>
</form>

<p><a class="voltar" href="{{ url_for('tarefas.index') }}">← Voltar</a></p>
{% endblock %}
