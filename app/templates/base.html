<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Gerenciador de Tarefas{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="container">
    <header>
      <h1><a href="{{ url_for('tarefas.index') }}">Gerenciador de Tarefas</a></h1>
    </header>

    {% with mensagens = get_flashed_messages(with_categories=true) %}
      {% for categoria, mensagem in mensagens %}
        <div class="aviso {{ categoria }}" role="alert">{{ mensagem }}</div>
      {% endfor %}
    {% endwith %}

    {% block conteudo %}{% endblock %}
  </main>
</body>
</html>
